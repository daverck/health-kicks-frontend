<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm space-y-3 md:hidden dark:border-gray-700 dark:bg-gray-800">
  <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-2">
    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300">
      {{ 'studio_history.filters_title' | translate }}
    </h3>
    @if (hasActiveFilters) {
      <button
        type="button"
        (click)="resetFilters.emit()"
        class="text-xs font-semibold text-primary-600 hover:text-primary-800"
      >
        ✕ {{ 'studio_history.reset_filters' | translate }}
      </button>
    }
  </div>

  <div class="space-y-2.5">
    <!-- Date filter -->
    <div>
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300 mb-1" for="mobile-filter-date">
        {{ 'studio_history.col_datetime' | translate }}
      </label>
      <app-date-filter
        triggerId="mobile-filter-date"
        [startDate]="startDate"
        [endDate]="endDate"
        (dateChange)="dateChange.emit($event)"
        size="sm"
        [fullWidth]="true"
      />
    </div>

    <!-- Status filter -->
    <div>
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300 mb-1" for="mobile-filter-validated">
        {{ 'studio_history.col_status' | translate }}
      </label>
      <select
        id="mobile-filter-validated"
        [ngModel]="selectedValidated"
        (ngModelChange)="validatedChange.emit($event)"
        class="h-9 w-full rounded-lg border border-gray-300 bg-white px-2.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
      >
        <option value="all">{{ 'studio_history.filter_all_statuses' | translate }}</option>
        <option value="true">✅ {{ 'studio_history.status_validated' | translate }}</option>
        <option value="false">⏳ {{ 'studio_history.status_pending' | translate }}</option>
      </select>
    </div>

    <!-- Mobile HITL filter -->
    <div>
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300 mb-1" for="mobile-filter-hitl">
        {{ 'studio_history.filter_hitl' | translate }}
      </label>
      <select
        id="mobile-filter-hitl"
        [ngModel]="selectedHitl"
        (ngModelChange)="hitlChange.emit($event)"
        class="h-9 w-full rounded-lg border border-gray-300 bg-white px-2.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
        data-testid="mobile-filter-hitl-select"
      >
        <option value="all">{{ 'studio_history.filter_all_hitl' | translate }}</option>
        <option value="true">{{ 'studio_history.filter_hitl_only' | translate }}</option>
        <option value="false">{{ 'studio_history.filter_standard_only' | translate }}</option>
      </select>
    </div>

    <!-- Device filter -->
    <div>
      <label class="block text-[11px] font-medium text-gray-600 mb-1" for="mobile-filter-device">
        {{ 'studio_history.col_device' | translate }}
      </label>
      <app-device-select
        triggerId="mobile-filter-device"
        [devices]="devices"
        [multiple]="true"
        [selectedDeviceIds]="selectedDeviceIds"
        [allowAll]="true"
        [allLabel]="'studio_history.filter_all_devices' | translate"
        (deviceIdsChange)="deviceIdsChange.emit($event)"
        size="sm"
        [fullWidth]="true"
      />
    </div>

    <!-- Activity label filter -->
    <div>
      <label class="block text-[11px] font-medium text-gray-600 mb-1" for="mobile-filter-label">
        {{ 'studio_history.col_label' | translate }}
      </label>
      <app-activity-select
        triggerId="mobile-filter-label"
        [multiple]="true"
        [selectedActivities]="selectedLabels"
        (activitiesChange)="labelsChange.emit($event)"
        [allLabel]="'studio_history.filter_all_labels' | translate"
        size="sm"
        [fullWidth]="true"
      />
    </div>

    <!-- Classification filter -->
    <div>
      <label class="block text-[11px] font-medium text-gray-600 mb-1" for="mobile-filter-classification">
        {{ 'studio_history.col_category' | translate }}
      </label>
      <select
        id="mobile-filter-classification"
        [ngModel]="selectedClassification"
        (ngModelChange)="classificationChange.emit($event)"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
        data-testid="mobile-filter-classification-select"
      >
        <option value="all">{{ 'studio_history.filter_all_types' | translate }}</option>
        <option value="edge_ai">⚡ {{ 'studio_history.badge_edge_ai' | translate }}</option>
        <option value="research">🧪 {{ 'studio_history.badge_research' | translate }}</option>
      </select>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300">
        {{ 'studio_history.filter_min_samples' | translate }}
        <input
          type="number"
          min="0"
          step="1"
          [ngModel]="sampleCountMin"
          (ngModelChange)="sampleCountMinChange.emit($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
          data-testid="mobile-filter-sample-count-min"
        />
      </label>
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300">
        {{ 'studio_history.filter_max_samples' | translate }}
        <input
          type="number"
          min="0"
          step="1"
          [ngModel]="sampleCountMax"
          (ngModelChange)="sampleCountMaxChange.emit($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
          data-testid="mobile-filter-sample-count-max"
        />
      </label>
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300">
        {{ 'studio_history.filter_min_duration' | translate }}
        <input
          type="number"
          min="0"
          step="0.1"
          [ngModel]="durationMin"
          (ngModelChange)="durationMinChange.emit($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
          data-testid="mobile-filter-duration-min"
        />
      </label>
      <label class="block text-[11px] font-medium text-gray-600 dark:text-gray-300">
        {{ 'studio_history.filter_max_duration' | translate }}
        <input
          type="number"
          min="0"
          step="0.1"
          [ngModel]="durationMax"
          (ngModelChange)="durationMaxChange.emit($event)"
          class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
          data-testid="mobile-filter-duration-max"
        />
      </label>
    </div>

    @if (isAdmin) {
      <!-- Author / User ID filter -->
      <div>
        <label class="block text-[11px] font-medium text-gray-600 mb-1" for="mobile-filter-author">
          {{ 'studio_history.col_author' | translate }}
        </label>
        <app-author-select
          triggerId="mobile-filter-author"
          [authors]="authors"
          [selectedUserIds]="selectedUserIds"
          (userIdsChange)="userIdsChange.emit($event)"
          size="sm"
          [fullWidth]="true"
        />
      </div>
    }
  </div>
</div>
