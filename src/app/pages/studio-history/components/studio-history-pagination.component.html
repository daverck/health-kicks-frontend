<div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 text-xs shadow-sm dark:border-gray-800 dark:bg-gray-900">
  <div class="flex items-center gap-2">
    <label for="page-size-select" class="text-gray-500 dark:text-gray-400">{{ 'studio_history.per_page' | translate }} :</label>
    <select
      id="page-size-select"
      [ngModel]="size"
      (ngModelChange)="pageSizeChange.emit(+$event)"
      class="rounded-md border border-gray-300 bg-white px-2 py-1 text-xs font-medium text-gray-700 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
    >
      <option [value]="10">10</option>
      <option [value]="20">20</option>
      <option [value]="50">50</option>
    </select>
  </div>

  <div class="flex items-center gap-1.5 text-gray-600 dark:text-gray-400">
    <label for="direct-page-input" class="font-medium">{{ 'studio_history.page_label' | translate }}</label>
    <input
      id="direct-page-input"
      type="number"
      min="1"
      [max]="totalPages"
      [value]="page"
      (change)="pageInput.emit($event)"
      (keydown.enter)="pageInput.emit($event)"
      class="w-14 rounded-md border border-gray-300 bg-white px-2 py-1 text-center text-xs font-semibold text-gray-800 shadow-2xs focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
      [attr.aria-label]="'studio_history.page_label' | translate"
    />
    <span>{{ 'studio_history.of_pages' | translate:{ totalPages: totalPages } }}</span>
    <span class="text-gray-400 dark:text-gray-500">({{ total }} sessions)</span>
  </div>

  <div class="flex items-center gap-2">
    <button
      id="first-page-btn"
      type="button"
      (click)="pageChange.emit(1)"
      [disabled]="page <= 1"
      [attr.aria-label]="'studio_history.first' | translate"
      class="rounded-lg border border-gray-300 bg-white px-2.5 py-1 text-xs font-semibold text-gray-700 shadow-2xs hover:bg-gray-100 transition disabled:opacity-40 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700"
    >
      « {{ 'studio_history.first' | translate }}
    </button>
    <button
      id="prev-page-btn"
      type="button"
      (click)="pageChange.emit(page - 1)"
      [disabled]="page <= 1"
      [attr.aria-label]="'studio_history.prev' | translate"
      class="rounded-lg border border-gray-300 bg-white px-3 py-1 text-xs font-semibold text-gray-700 shadow-2xs hover:bg-gray-100 transition disabled:opacity-40 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700"
    >
      ← {{ 'studio_history.prev' | translate }}
    </button>
    <button
      id="next-page-btn"
      type="button"
      (click)="pageChange.emit(page + 1)"
      [disabled]="page >= totalPages"
      [attr.aria-label]="'studio_history.next' | translate"
      class="rounded-lg border border-gray-300 bg-white px-3 py-1 text-xs font-semibold text-gray-700 shadow-2xs hover:bg-gray-100 transition disabled:opacity-40 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700"
    >
      {{ 'studio_history.next' | translate }} →
    </button>
    <button
      id="last-page-btn"
      type="button"
      (click)="pageChange.emit(totalPages)"
      [disabled]="page >= totalPages"
      [attr.aria-label]="'studio_history.last' | translate"
      class="rounded-lg border border-gray-300 bg-white px-2.5 py-1 text-xs font-semibold text-gray-700 shadow-2xs hover:bg-gray-100 transition disabled:opacity-40 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700"
    >
      {{ 'studio_history.last' | translate }} »
    </button>
  </div>
</div>
