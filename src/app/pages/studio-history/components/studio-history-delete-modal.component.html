<div
  id="delete-session-modal"
  class="fixed inset-0 !m-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm transition-opacity"
  (click)="cancel.emit()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-session-title"
>
  <div
    class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-2xl space-y-4"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-red-100 text-lg text-red-600">
        🗑️
      </div>
      <div>
        <h3 id="delete-session-title" class="text-sm font-bold text-gray-900">
          {{ 'studio_history.delete_session' | translate }}
        </h3>
        <p class="text-xs text-gray-500 font-mono mt-0.5">
          {{ session.device_id }} · {{ session.created_at | date:'dd/MM/yyyy HH:mm' }}
        </p>
      </div>
    </div>

    <p class="text-xs text-gray-600">
      {{ 'studio_history.delete_confirm' | translate }}
    </p>

    <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100">
      <button
        id="cancel-modal-delete-btn"
        type="button"
        (click)="cancel.emit()"
        class="rounded-lg border border-gray-300 bg-white px-3.5 py-1.5 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition active:scale-95"
      >
        {{ 'common.cancel' | translate }}
      </button>
      <button
        id="confirm-modal-delete-btn"
        type="button"
        (click)="confirm.emit(session.uuid || session.id || '')"
        data-testid="confirm-modal-delete-btn"
        class="inline-flex items-center gap-1.5 rounded-lg bg-red-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-sm hover:bg-red-700 transition active:scale-95 disabled:opacity-50"
      >
        {{ 'studio_history.delete_session' | translate }}
      </button>
    </div>
  </div>
</div>
