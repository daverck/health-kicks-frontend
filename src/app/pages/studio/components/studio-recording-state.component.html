<div class="flex flex-col items-center justify-center rounded-2xl border border-blue-200 bg-blue-50/70 p-12 text-center shadow-sm">
  <div class="relative flex h-24 w-24 items-center justify-center rounded-full bg-blue-100 ring-8 ring-blue-200/50">
    <app-activity-icon [activityId]="effectiveLabel" [size]="44" className="text-blue-600 animate-bounce" />
  </div>
  <h2 class="mt-6 text-2xl font-extrabold text-blue-900">{{ 'studio.recording_title' | translate }}</h2>
  <p class="mt-2 max-w-md text-sm text-blue-800">
    {{ 'studio.recording_desc' | translate:{ label: displayLabel } }}
  </p>

  <!-- Progress bar -->
  <div class="mt-8 w-full max-w-md">
    <div class="flex justify-between text-xs font-semibold text-blue-700 mb-1.5">
      <span>{{ 'studio.capture_time' | translate }}</span>
      <span>{{ (progressPercent * 5 / 100).toFixed(1) }}s / 5.0s</span>
    </div>
    <div class="h-4 w-full overflow-hidden rounded-full bg-blue-200/70 p-0.5">
      <div
        class="h-full rounded-full bg-blue-600 transition-all duration-75 ease-linear"
        [style.width.%]="progressPercent"
      ></div>
    </div>
  </div>
</div>
