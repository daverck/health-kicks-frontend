<div
  class="fixed inset-0 !m-0 z-50 flex items-center justify-center bg-black/40 p-4 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  data-testid="delete-confirm-modal"
>
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl space-y-4 dark:border dark:border-gray-800 dark:bg-gray-900">
    <div class="flex items-center gap-3 text-red-600 dark:text-red-400">
      <span class="text-2xl">⚠️</span>
      <h3 class="text-base font-bold text-gray-900 dark:text-white">
        {{ 'studio.reject_session' | translate }}
      </h3>
    </div>
    <p class="text-sm text-gray-600 dark:text-gray-300">
      {{ 'studio.reject_confirm' | translate }}
    </p>
    <div class="flex justify-end gap-3 pt-2">
      <button
        type="button"
        (click)="cancel.emit()"
        class="rounded-xl border border-gray-300 bg-white px-4 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50 transition dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700"
      >
        {{ 'common.cancel' | translate }}
      </button>
      <button
        id="confirm-reject-btn"
        type="button"
        (click)="confirm.emit()"
        class="inline-flex items-center gap-2 rounded-xl bg-red-600 px-4 py-2 text-xs font-semibold text-white hover:bg-red-700 transition disabled:opacity-50"
      >
        <span>🗑️</span> {{ 'common.delete' | translate }}
      </button>
    </div>
  </div>
</div>
