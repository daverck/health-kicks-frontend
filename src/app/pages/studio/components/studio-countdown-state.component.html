<div class="flex flex-col items-center justify-center rounded-2xl border border-amber-200 bg-amber-50/70 p-12 text-center shadow-sm">
  <div class="relative flex h-24 w-24 items-center justify-center rounded-full bg-amber-100 ring-8 ring-amber-200/50 animate-pulse">
    <span class="text-4xl">📳</span>
  </div>
  <h2 class="mt-6 text-2xl font-extrabold text-amber-900">{{ 'studio.countdown_title' | translate }}</h2>
  <p class="mt-2 max-w-md text-sm text-amber-800">
    {{ 'studio.countdown_desc' | translate }}
  </p>
  <div class="mt-6 flex items-center gap-3">
    <span class="flex h-3 w-3 rounded-full bg-amber-500 animate-ping"></span>
    <span class="text-xs font-semibold text-amber-700 uppercase tracking-wider">{{ 'studio.sync_vibrations' | translate }}</span>
  </div>

  <!-- Annuler & Retour Button inside Step 2 -->
  <button
    type="button"
    (click)="onCancel()"
    class="mt-8 inline-flex items-center gap-2 rounded-xl border border-amber-300 bg-white px-5 py-2 text-xs font-semibold text-amber-900 shadow-sm hover:bg-amber-100/50 transition active:scale-95"
  >
    {{ 'common.cancel_and_back' | translate }}
  </button>
</div>
