<div class="mx-auto max-w-7xl space-y-6">
  <!-- Loading state -->
  @if (isLoading()) {
    <div class="flex flex-col items-center justify-center rounded-2xl border border-gray-200 bg-white p-16 text-center shadow-sm">
      <svg class="h-10 w-10 text-primary-600 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p class="mt-4 text-sm font-medium text-gray-500">{{ 'studio_history.loading' | translate }}</p>
    </div>
  } @else if (errorMessage()) {
    <!-- Error / Not found state -->
    <div class="rounded-2xl border border-red-200 bg-white p-12 text-center shadow-sm space-y-4">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-red-100 text-2xl">
        ⚠️
      </div>
      <h2 class="text-lg font-bold text-gray-900">{{ 'studio_history.session_not_found' | translate }}</h2>
      <p class="text-sm text-gray-500 max-w-md mx-auto">
        {{ errorMessage()! | translate }}
      </p>
      <div class="pt-2">
        <a
          routerLink="/dashboard/studio/history"
          class="inline-flex items-center gap-2 rounded-xl bg-primary-600 px-4 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-primary-700 transition active:scale-95"
          data-testid="error-back-btn"
        >
          <span>←</span>
          <span>{{ 'studio_history.back_to_history' | translate }}</span>
        </a>
      </div>
    </div>
  } @else if (session()) {
    <!-- Reused Reusable Inspection Component -->
    <app-studio-inspection
      [session]="session()!"
      [isStandalone]="true"
      (sessionUpdated)="onSessionUpdated($event)"
      (sessionConfirmed)="onSessionConfirmed($event)"
      (sessionDeleted)="onSessionDeleted()"
      (close)="goBack()"
    />
  }
</div>
