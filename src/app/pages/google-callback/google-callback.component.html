<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <div class="card w-full max-w-md text-center">
    @if (error()) {
      <div class="mb-4 text-4xl">⚠️</div>
      <h1 class="text-xl font-bold text-red-600">Échec de la connexion Google</h1>
      <p class="mt-2 text-sm text-gray-600">{{ error() }}</p>
      <a routerLink="/login" class="btn-primary mt-6">Retour à la connexion</a>
    } @else {
      <div class="mb-4 flex justify-center">
        <span class="h-10 w-10 animate-spin rounded-full border-4 border-primary-200 border-t-primary-600"></span>
      </div>
      <h1 class="text-lg font-semibold">Connexion avec Google en cours…</h1>
      <p class="mt-2 text-sm text-gray-600">Finalisation de l'authentification, veuillez patienter.</p>
    }
  </div>
</div>
