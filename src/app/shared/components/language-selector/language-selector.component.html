<div class="relative inline-block text-left">
  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="inline-flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 text-xs font-semibold text-gray-700 shadow-sm transition hover:border-gray-300 hover:bg-gray-50 focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
    aria-label="Sélectionner la langue / Select language"
  >
    <span class="text-sm leading-none">{{ translation.currentMeta().flag }}</span>
    @if (!compact()) {
      <span class="font-medium text-gray-800">{{ translation.currentMeta().nativeName }}</span>
    } @else {
      <span class="uppercase font-mono text-[11px] text-gray-600">{{ translation.currentMeta().code }}</span>
    }
    <svg
      class="h-3.5 w-3.5 text-gray-400 transition-transform duration-150"
      [class.rotate-180]="isOpen()"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  <!-- Dropdown List -->
  @if (isOpen()) {
    <!-- Backdrop to close when clicking outside -->
    <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>

    <div
      class="absolute right-0 z-50 mt-1.5 w-48 origin-top-right overflow-hidden rounded-xl border border-gray-200 bg-white p-1.5 shadow-xl ring-1 ring-black/5"
    >
      <div class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-gray-400">
        Langue / Language
      </div>
      @for (lang of translation.supportedLanguages; track lang.code) {
        <button
          type="button"
          (click)="selectLanguage(lang.code)"
          class="flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-left text-xs transition hover:bg-primary-50"
          [class.bg-primary-50]="lang.code === translation.currentLang()"
          [class.font-semibold]="lang.code === translation.currentLang()"
          [class.text-primary-900]="lang.code === translation.currentLang()"
        >
          <div class="flex items-center gap-2">
            <span class="text-sm leading-none">{{ lang.flag }}</span>
            <div class="flex flex-col">
              <span class="text-gray-900">{{ lang.nativeName }}</span>
              <span class="text-[10px] text-gray-400 font-normal">{{ lang.name }}</span>
            </div>
          </div>
          @if (lang.code === translation.currentLang()) {
            <span class="text-xs font-bold text-primary-600">✓</span>
          }
        </button>
      }
    </div>
  }
</div>
